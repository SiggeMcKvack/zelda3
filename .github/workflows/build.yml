name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'android/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'android/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsdl2-dev \
          libopus-dev \
          python3 \
          python3-pip \
          libopenal-dev \
          libyaml-dev \
          libgtk-3-dev

    - name: Extract assets
      run: |
        # Skip asset extraction in CI - would need ROM
        # Users must extract assets locally
        echo "Skipping asset extraction (requires ROM)"

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      if: matrix.build_type == 'Debug'
      run: ctest --test-dir build --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-linux-${{ matrix.build_type }}
        path: |
          build/zelda3
          build/zelda3-launcher
          build/*.so
        if-no-files-found: ignore

  build-windows:
    name: Windows (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-gtk3
          mingw-w64-x86_64-opus
          mingw-w64-x86_64-openal
          mingw-w64-x86_64-libyaml

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      if: matrix.build_type == 'Debug'
      run: ctest --test-dir build --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-windows-${{ matrix.build_type }}
        path: |
          build/zelda3.exe
          build/zelda3-launcher.exe
          build/*.dll
        if-no-files-found: ignore

  build-macos-arm64:
    name: macOS ARM64 (${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install sdl2 opus openal-soft cmake libyaml gtk+3

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
          -DCMAKE_OSX_ARCHITECTURES=arm64

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Run tests
      if: matrix.build_type == 'Debug'
      run: ctest --test-dir build --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-macos-arm64-${{ matrix.build_type }}
        path: |
          build/zelda3
          build/zelda3-launcher
          build/*.dylib
        if-no-files-found: ignore

