name: Android Build

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'snes/**'
      - 'assets/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'snes/**'
      - 'assets/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-android:
    name: Android (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - build_type: debug
            gradle_task: assembleDebug
          - build_type: release
            gradle_task: assembleRelease

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew ${{ matrix.gradle_task }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-android-${{ matrix.build_type }}
        path: android/app/build/outputs/apk/${{ matrix.build_type }}/app-${{ matrix.build_type }}*.apk
        if-no-files-found: error
