<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zelda3 Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="tabs" class="tabs"></nav>

  <main id="panels" class="panels"></main>

  <footer class="footer">
    <span id="status" class="status"></span>
    <div class="actions">
      <button id="btn-reset" class="btn">Reset to defaults</button>
      <button id="btn-validate" class="btn">Validate</button>
      <button id="btn-save" class="btn btn-primary">Save</button>
      <button id="btn-launch" class="btn btn-launch">Save &amp; Launch</button>
    </div>
  </footer>

  <script src="js/schema.js"></script>
  <script src="js/keymap.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
